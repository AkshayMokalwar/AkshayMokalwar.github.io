<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customized Birthday Page</title>
    <link rel="stylesheet" href="create-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="form-container">
        <h2>🎉 Create Birthday Surprise</h2>
        <p class="subtitle">Customize a stunning page & schedule automated WhatsApp delivery!</p>

        <form id="birthday-form">
            <!-- Step 1: Birthday Person Details -->
            <div class="form-group">
                <label>Special Person's Name *</label>
                <input type="text" id="personName" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group row">
                <div class="col">
                    <label>Birthday Date *</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="col">
                    <label>Schedule Timing *</label>
                    <select id="scheduleTime">
                        <option value="00:00" selected>12:00 AM (Midnight Wish)</option>
                        <option value="08:00">08:00 AM (Morning Wish)</option>
                        <option value="12:00">12:00 PM (Noon Wish)</option>
                        <option value="20:00">08:00 PM (Evening Wish)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Recipient WhatsApp Number (With Country Code) *</label>
                <input type="tel" id="recipientPhone" placeholder="e.g. 919876543210" required>
            </div>

            <div class="form-group">
                <label>Custom Wish Message *</label>
                <textarea id="customWish" rows="3" placeholder="Write a special wish here..." required></textarea>
            </div>

            <div class="form-group">
                <label>Upload 2 to 3 Photos *</label>
                <input type="file" id="imageFiles" accept="image/*" multiple required>
                <small>Select 2 or 3 best photos.</small>
            </div>

            <!-- Step 2: Payment Section -->
            <div class="payment-section">
                <h3>💳 Payment & Confirmation</h3>
                <p>Select service charge to activate scheduling:</p>

                <div class="amount-selector">
                    <button type="button" class="amt-btn active" data-amt="10">₹10</button>
                    <button type="button" class="amt-btn" data-amt="25">₹25</button>
                    <button type="button" class="amt-btn" data-amt="50">₹50</button>
                </div>

                <div class="qr-box">
                    <img id="upiQrCode" src="" alt="UPI QR Code">
                    <p>Scan & Pay using GPay, PhonePe, or Paytm</p>
                </div>

                <div class="form-group">
                    <label>UPI Transaction ID / UTR Number *</label>
                    <input type="text" id="utrNumber" placeholder="12-digit UTR/Transaction ID" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">🚀 Schedule Birthday Surprise</button>
        </form>

        <div id="statusMessage" class="status-msg"></div>
    </div>

    <script src="create.js"></script>
</body>
</html>
